<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Measurements and Colors</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background-color: #eef2ff;
        }

        h1 {
            text-align: center;
            color: #4c1d95;
            margin-bottom: 30px;
        }

        .box {
            width: 500px;
            min-height: 250px;
            margin: auto;
            padding: 30px;
            background-color: #ffffff;
            border: 4px solid #7c3aed;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        p {
            font-size: 18px;
            color: #374151;
            line-height: 1.7;
        }

        .highlight {
            color: #ffffff;
            background-color: #7c3aed;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>CSS Measurements and Colors</h1>

    <div class="box">

        <p>
            This box demonstrates CSS
            <strong>measurements</strong> such as
            width, height, margin, padding, and border.
        </p>

        <p class="highlight">
            This section demonstrates foreground and background colors.
        </p>

    </div>

</body>
</html>
